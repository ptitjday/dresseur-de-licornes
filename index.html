  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1f6b55; color: #fff7e9; font-family: "Noto Sans SC", system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; z-index: 2; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #1f6b55; text-align: center; }
    #loading[hidden], [hidden] { display: none !important; }
    #game-icon { display: block; width: min(128px, 23vw, 22vh); height: min(128px, 23vw, 22vh); object-fit: contain; filter: drop-shadow(0 6px 12px #123c3355); }
    .eyebrow { margin: 0; color: #f4d58a; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 0; font-size: clamp(23px, 5vw, 38px); line-height: 1.18; overflow-wrap: anywhere; }
    #loading-status { max-width: 460px; margin: 0; color: #f6f1e3; font-size: 16px; line-height: 1.5; }
    progress { width: min(360px, 78vw); height: 9px; border: 0; border-radius: 99px; overflow: hidden; appearance: none; background: #174b3e; }
    progress::-webkit-progress-bar { border-radius: 99px; background: #174b3e; }
    progress::-webkit-progress-value { border-radius: 99px; background: #e8b65a; transition: width .18s linear; }
    progress::-moz-progress-bar { border-radius: 99px; background: #e8b65a; }
    #loading-notice { max-width: 460px; margin: 0; color: #ffedc6; font-size: 14px; line-height: 1.5; }
    button { min-height: 46px; padding: 10px 24px; border: 1px solid #f4d58a; border-radius: 14px; background: #174b3e; color: #fff7e9; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff7e9; outline-offset: 4px; }
    @media (max-height: 560px) and (min-aspect-ratio: 1/1) { #loading { gap: 8px; } #game-icon { width: 74px; height: 74px; } h1 { font-size: clamp(20px, 4vw, 30px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

<body>
  <canvas id="canvas" tabindex="0" aria-label="Zone de jeu">Ton navigateur ne prend pas en charge le canevas.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <img id="game-icon" alt="Embleme du jeu">
    <p class="eyebrow">Une aventure en trois royaumes</p>
    <h1 id="game-title"></h1>
    <p id="loading-status">Le jeu se prepare...</p>
    <progress id="loading-progress" aria-label="Progression du chargement"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Reessayer</button>
    <noscript>JavaScript est necessaire pour jouer a ce jeu.</noscript>
  </section>
  <script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7923616,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.documentElement.lang = 'fr';
      document.getElementById('game-title').textContent = document.title;
      document.getElementById('game-icon').src = document.getElementById('game-favicon').href;
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? 'Le chargement semble bloque. Tu peux attendre ou reessayer.'
          : 'Le chargement prend plus de temps que prevu. Tu peux attendre ou reessayer.';
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Echec du demarrage', error);
        loading.hidden = false;
        status.textContent = 'Impossible de charger le jeu. Tu peux reessayer.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'Chargement en cours...';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'Demarrage du jeu...' : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
