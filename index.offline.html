<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251c">
  <title>Hors connexion — Les trois royaumes</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10251c; color: #fff5d9; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 30px 24px; border: 1px solid #d9b75d66; border-radius: 24px; background: #1a3528; text-align: center; }
    .mark { display: inline-grid; width: 70px; height: 70px; place-items: center; border: 2px solid #d9b75d; border-radius: 50%; color: #f0cf72; font-size: 2rem; }
    h1 { margin: 18px 0 10px; font-size: 1.55rem; }
    p { line-height: 1.55; color: #e7d9ad; }
    button { min-height: 48px; margin-top: 12px; padding: 0 22px; border: 0; border-radius: 14px; background: #f0cf72; color: #31270f; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff5d9; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Tu es hors connexion</h1>
    <p>Le jeu n’a pas encore été enregistré sur cet appareil, ou son cache a été effacé. Reconnecte-toi une fois pour le charger, puis réessaie.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
